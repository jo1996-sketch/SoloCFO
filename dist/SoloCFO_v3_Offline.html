 ${field('valuation.baseYear','Basisjahr / Stichtag Jahresende',{min:2000,max:2100,step:1})}${field('valuation.revenue','Umsatz im Basisjahr (€)',{min:1})}${field('valuation.openingWC','Operatives NWC zu Beginn (€)',{hint:'Vorräte + Forderungen − Lieferverbindlichkeiten'})}${field('valuation.taxPct','Plansteuersatz (%)',{min:0,max:100,hint:'Keine automatische Rechtsform-/Steuerprüfung'})}
 ${field('valuation.wacc','Kapitalkosten / WACC (%)',{min:.1,max:50})}${field('valuation.terminalGrowth','Ewiges Wachstum (%)',{min:0,max:10})}${field('valuation.terminalRoic','Nachhaltiger ROIC (%)',{min:.1,max:100,hint:'Nachsteuer-Rendite auf investiertes Kapital'})}
 </div></section>
 <section class="card span-12">${sectionLabel('02','Fünf Jahre, transparente Treiber','Jede Spalte ist ein Planjahr. Investitionen und Working Capital wirken auf den freien Cashflow.')}<div class="table-wrap"><table class="editor-table forecast-editor"><thead><tr><th>Annahme · % des Umsatzes, sofern nicht anders bezeichnet</th>${p.years.map((y,i)=>`<th>${Number(p.baseYear)+i+1}</th>`).join('')}</tr></thead><tbody>${[['growth','Umsatzwachstum (%)'],['ebitMargin','Operative EBIT-Marge (%)'],['daPct','Abschreibungen / Umsatz (%)'],['capexPct','Investitionen / Umsatz (%)'],['wcPct','Operatives NWC / Umsatz (%)']].map(([k,label])=>`<tr><td>${label}</td>${p.years.map((y,i)=>`<td><input type="number" step="any" data-model="valuation.years.${i}.${k}" value="${html(y[k])}" aria-label="${label} ${Number(p.baseYear)+i+1}" /></td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
 <section class="card span-8"><div class="inner-row"><div><h2 class="card-title">Was bleibt als freier Cashflow?</h2><p class="card-sub">Free Cash Flow to Firm · vor Zinsen und Finanzierung</p></div><span class="tag subtle">EUR</span></div>${r.valid?forecastChart(r.years):'<div class="empty">Planannahmen vervollständigen, um Cashflows zu sehen.</div>'}</section>

 </div>
 ${r.valid?`<section class="card section-gap"><h2 class="card-title">Cashflow-Rechnung zum Nachprüfen</h2><p class="card-sub">Zahlungen jeweils am Jahresende · konstante Plansteuersätze · keine Steuererstattung bei Verlusten</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Position in EUR</th>${r.years.map(y=>`<th>${y.year}</th>`).join('')}</tr></thead><tbody>${[['Umsatz','revenue'],['EBIT','ebit'],['− Operative Steuern','taxes'],['= NOPAT','nopat'],['+ Abschreibungen','depreciation'],['− Investitionen (Capex)','capex'],['− Veränderung NWC','deltaWC'],['= Freier Cashflow (FCFF)','fcff'],['Barwert des FCFF','pv']].map(([label,k])=>`<tr class="${['fcff','pv'].includes(k)?'emph':''}"><td>${label}</td>${r.years.map(y=>`<td class="${y[k]<0?'loss':''}">${euro(y[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
 <div class="grid section-gap"><section class="card span-6"><h2 class="card-title">Die Wertbrücke</h2><p class="card-sub">Operativer Wert und Wert der Anteile sind unterschiedliche Größen</p><div class="metric-list">${metric('Barwert der expliziten Planjahre',euro(r.forecastPV))}${metric('+ Barwert des nachhaltigen Endwerts',euro(r.terminalPV))}${metric('= Enterprise Value',euro(r.enterpriseValue))}${metric('+ Überschüssige liquide Mittel',euro(Number(p.cash)))}${metric('− Verzinsliche Finanzschulden',euro(Number(p.debt)))}${metric('+ / − Sonstige Wertkorrekturen',euro(Number(p.adjustments)))}${metric('= Eigenkapitalwert',`<span class="value-emphasis">${euro(r.equityValue)}</span>`)}</div>${warningsBox(r)}</section>
 <section class="card span-6"><h2 class="card-title">Wie empfindlich ist der Wert?</h2><p class="card-sub">Eigenkapitalwert in EUR · WACC → / ewiges Wachstum ↓</p><div class="table-wrap"><table class="data-table sensitivity-table"><thead><tr><th>g / WACC</th>${s.waccs.map(w=>`<th>${pct(w)}</th>`).join('')}</tr></thead><tbody>${s.growths.map((g,i)=>`<tr><th>${pct(g)}</th>${s.values[i].map((v,j)=>`<td class="${i===2&&j===2?'selected-cell':''}">${v===null?'–':euro(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="hint">Markierte Zelle = Basisannahme. „–“ = unzulässige Kombination (z. B. g ≥ WACC). Die Matrix ist eine Sensitivität, kein statistisches Konfidenzintervall.</p></section></div>
 <section class="card section-gap"><h2 class="card-title">Drei Perspektiven auf dieselbe Planung</h2><p class="card-sub">Vorbereitete Annahmen, keine Eintrittswahrscheinlichkeiten. Investitionen und NWC-Quoten bleiben konstant.</p><div class="scenario-perspectives">${variants.map((v,i)=>`<div class="perspective ${i===1?'base':''}"><span>${v.name}</span><strong>${euro(v.result.equityValue)}</strong><small>${i===0?'Wachstum −2 Pp. · EBIT-Marge −2 Pp. · WACC +1 Pp.':i===2?'Wachstum +2 Pp. · EBIT-Marge +2 Pp. · WACC −1 Pp.':'Deine unveränderte Planung'}</small>${!v.result.valid?'<small>Kein Wert: Annahmen außerhalb der Modellgrenzen.</small>':''}</div>`).join('')}</div></section>`:''}
 <details data-detail-key="dcf-method" class="card method-details section-gap"><summary>DCF-Methodik, Endwert & Grenzen</summary><p>FCFF = EBIT − max(0, EBIT) × Steuersatz + Abschreibungen − Capex − ΔNWC. Unternehmenswert = Σ FCFFₜ / (1 + WACC)ᵗ + Endwert / (1 + WACC)ⁿ. Der Stichtag liegt vor dem ersten Planjahr; keine unterjährige Diskontierung.</p><p>Nachhaltiger NOPAT = Umsatz im letzten Planjahr × (1 + g) × letzte EBIT-Marge × (1 − Steuersatz). Die nachhaltige Reinvestition beträgt NOPAT × g / ROIC. Endwert = (nachhaltiger NOPAT − Reinvestition) / (WACC − g). Damit wird Wachstum im Endwert nicht als investitionsfrei unterstellt. Capex-/NWC-Quoten der Detailplanung werden im Endwert durch diesen nachhaltigen Reinvestitionsansatz ersetzt.</p><p>WACC, ROIC, Überschussliquidität und Planmargen sind eigene Bewertungsannahmen. Keine automatische Marktdatenabfrage, keine Verlustvorträge, Pensions-/Leasinganpassungen oder käuferspezifischen Synergien. Das Modell ist kein Bewertungsgutachten nach KFS/BW 1 oder IDW S 1.</p></details>`;
}

-dot':'live-dot'}"></span>${state.demo?'Demo-Modus · Alle Unternehmensdaten sind fiktiv.':'Eigene Daten · Lokal in diesem Browser gespeichert.'}<span class="banner-secondary">Planungsannahmen separat prüfen.</span></div><main class="content" id="main-content">${route()}<footer class="footer"><span>SoloCFO <span class="footer-separator">/</span> Klarheit für bessere Entscheidungen.</span><button class="text-button" data-go="about">Methodik & Datenhinweise ${icon('about',13)}</button></footer></main></div></div><nav class="mobile-bottom no-print" aria-label="Schnellnavigation">${[['dashboard','Start'],['scenario','Szenarien'],['hourly','Stundensatz'],['valuation','Bewertung'],['menu','Mehr']].map(([id,label])=>`<button data-go="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}>${icon(id,20)}<span>${label}</span></button>`).join('')}</nav><div id="notification" hidden role="status"></div>`;

 <div class="span-5"><div class="card"><h3 class="card-title">Projektverwaltung</h3><p class="card-sub">Lokales Projekt und Jahresdaten</p><div class="field-grid">${field('company','Unternehmensname',{type:'text'})}</div><div class="metric-list section-gap">${metric('Erfasste Geschäftsjahre',list.length)}${metric('Aktuelles Analysejahr',state.year)}${metric('Datentyp',state.demo?'Fiktive Demonstrationsdaten':'Eigene Eingaben')}${metric('Speicherort','Dieser Browser / dieses Gerät')}</div><div class="row-wrap section-gap"><button class="button" data-action="add-year">+ Jahr hinzufügen</button><button class="button danger" data-action="reset-demo">Demo wiederherstellen</button></div></div></div>

 <h3 class="card-title">1. Finanzielle Ausgangslage</h3><p class="hint">Datenqualität: ${q.score}/100 – ${html(q.status)}; bitte vor Verwendung prüfen.</p><div class="grid section-gap"><div class="span-3">${stat('Umsatz',short(a.revenue))}</div><div class="span-3">${stat('EBITDA',short(a.ebitda))}</div><div class="span-3">${stat('EBITDA-Marge',pct(a.ebitdaMargin))}</div><div class="span-3">${stat('Liquide Mittel',short(a.cash))}</div></div>

 <div class="section-gap"><h3 class="card-title">5. Zusätzliche Berechnungen</h3><div class="metric-list">${metric('Ziel-Stundensatz (detailliertes Modell, netto)',euro2(h.price))}${metric('Rechnerischer DCF-Eigenkapitalwert',euro(E.dcf(state.valuation).equityValue))}${metric('DCF-Planbasis',html(state.valuation.label))}${metric('Stundensatz-Planbasis',html(state.hourlyPlan.label))}${metric('Break-even im Business Case / Monat',p.breakEvenUnits===null?'Nicht erreichbar':num(Math.ceil(p.breakEvenUnits/12))+' Einheiten')}</div></div>
 ${planningReport()}<div class="section-gap callout amber"><strong>Methodische Einschränkung:</strong> Rechenregeln sind deterministisch; dieses MVP führt keine KI-Erklärungen und keine fachliche Prüfung hochgeladener Dokumente durch. Alle Hinweise basieren auf allgemeinen Prüfregeln und manuell zugeordneten Daten. Keine Prüfung nach UGB, keine verifizierten Branchenbenchmarks, DCF ist eine indikative Planbewertung; kein fachlich geprüftes Bewertungsgutachten. ${state.missingFields.length?'Beim CSV-Import fehlen Spalten; Aussagen können unvollständig sein.':''}</div>
 <p class="footer">SoloCFO 3.0 · Entwicklungsstand · erstellt lokal ohne Übermittlung an externe Server · Szenarien sind Annahmen, keine Prognosen.</p></div></div>`;

function planningReport(){
 const p=state.valuation,r=E.dcf(p),h=E.hourlyDetailed(state.hourlyPlan);
 return `<section class="print-section section-gap"><h3 class="card-title">6. DCF-Unternehmensbewertung</h3><p class="hint">${html(p.label)} · Stichtag Ende ${html(p.baseYear)}. Indikative Bewertung, kein Gutachten. WACC ${pct(Number(p.wacc))}, ewiges Wachstum ${pct(Number(p.terminalGrowth))}, nachhaltiger ROIC ${pct(Number(p.terminalRoic))}, Plansteuersatz ${pct(Number(p.taxPct))}.</p>${r.valid?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Planjahr</th>${r.years.map(y=>`<th>${y.year}</th>`).join('')}</tr></thead><tbody>${[['Umsatz','revenue'],['EBIT','ebit'],['FCFF','fcff'],['Barwert FCFF','pv']].map(([label,k])=>`<tr><td>${label}</td>${r.years.map(y=>`<td>${euro(y[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="metric-list section-gap">${metric('Barwert Planjahre',euro(r.forecastPV))}${metric('Barwert Endwert / Anteil',euro(r.terminalPV)+' / '+pct(r.terminalShare))}${metric('Operativer Unternehmenswert',euro(r.enterpriseValue))}${metric('− Finanzschulden + liquide Überschussmittel + Korrekturen',euro(-Number(p.debt)+Number(p.cash)+Number(p.adjustments)))}${metric('Rechnerischer Eigenkapitalwert',euro(r.equityValue))}</div><p class="hint">Endwert-FCFF = nachhaltiger NOPAT × (1 − g / ROIC). Endwert = Endwert-FCFF / (WACC − g). Vollständige Annahmen und Jahresrechnung im CSV-Export der Bewertung.</p>${warningsBox(r)}`:errorsBox(r)}</section>
 <section class="print-section section-gap"><h3 class="card-title">7. Stundensatz & Verrechenbarkeit</h3><p class="hint">${html(state.hourlyPlan.label)} · separate Jahresplanung ohne USt. Zielmarge ${pct(Number(state.hourlyPlan.targetMargin))} auf Stundenumsatz, Reserve ${pct(Number(state.hourlyPlan.riskPct))} auf Kosten.</p>${h.valid?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Mitarbeitergruppe</th><th>FTE</th><th>Personalkosten/Jahr</th><th>Verrechenbare h</th></tr></thead><tbody>${h.teams.map(t=>`<tr><td>${html(t.name)}</td><td>${num(Number(t.fte),1)}</td><td>${euro(t.annualCost)}</td><td>${num(t.billableHours)}</td></tr>`).join('')}</tbody></table></div><div class="metric-list section-gap">${metric('Personal + Gemeinkosten',euro(h.annualCosts))}${metric('+ Reserve − Material-/Fremdleistungs-DB',euro(h.reserve-h.otherContribution))}${metric('Durch Stunden zu deckender Bedarf',euro(h.recovery))}${metric('Bezahlte / verrechenbare Stunden',num(h.paidHours)+' / '+num(h.hours))}${metric('Kostenuntergrenze inkl. Reserve / Ziel-Netto-Stundensatz',euro2(h.hourlyCost)+' / '+euro2(h.price))}${metric('Jahresergebnis beim aktuellen Satz, nach Reserve',euro(h.currentAfterReserve))}</div><p class="hint">Stundensatz = max(0, Kosten inkl. Reserve − Material-/Fremdleistungs-DB) / verrechenbare Stunden / (1 − Zielmarge). Kein bilanzielles EBITDA. Vollständige Eingaben im Stundensatz-CSV.</p>${warningsBox(h)}`:errorsBox(h)}</section>`;
}
function about(){return heading('Methodik & Datenschutz','Technischer und fachlicher Status dieser Version – transparent dokumentiert.')+`
 <div class="grid"><div class="span-6"><div class="card"><h3 class="card-title">Was funktioniert bereits?</h3><ul class="list-notes"><li>Mehrjährige GuV- und Bilanzkennzahlen, Veränderungsrechnung und regelbasierte Hinweise</li><li>Preise, Absatz, Material, Personal und Fixkosten als EBITDA-Szenario</li><li>Detaillierte Stundenkalkulation mit Mitarbeitergruppen, Ausfallzeiten, Verrechenbarkeit, Gemeinkosten und Deckungsbeiträgen</li><li>DCF-Unternehmensbewertung mit fünf Planjahren, nachhaltiger Reinvestition, Wertbrücke und Sensitivitätsmatrix</li><li>Vereinfachter Business Case über drei Jahre mit Finanzierung und Break-even</li><li>CSV-Import, lokale Datenbearbeitung, JSON-Datensicherung und PDF-Druck</li><li>Responsives Layout für Desktop und Smartphone</li></ul></div></div><div class="span-6"><div class="card"><h3 class="card-title">Was fehlt für ein kommerzielles Produkt?</h3><ul class="list-notes"><li>Sichere Nutzerkonten, Mandantentrennung, Backups und DSGVO-Dokumentation für gehostete Nutzung</li><li>PDF- und XLSX-Auslesung mit Kontenmapping, Prüfung und Originalbeleg-Rückverfolgung</li><li>Validierte Branchenbenchmarks mit Nutzungsrechten und regelmäßig aktualisierten Daten</li><li>KI-Erklärungen mit kontrollierten Eingaben, Tests und Providervertrag</li><li>Mehrperioden-Planung mit integrierter GuV/Bilanz/Cashflow sowie Steuern, Working Capital und Zahlungsverhalten</li><li>App-Store-Veröffentlichung, In-App-Käufe, Tests, rechtliche Angaben und produktives Hosting</li></ul></div></div>
 <div class="span-12"><div class="card"><h3 class="card-title">Datensicherheit in dieser Testversion</h3><p class="page-desc">SoloCFO speichert Projektdaten ausschließlich im lokalen Browser-Speicher (localStorage). Es existieren kein Benutzerkonto, kein Backend und keine Telemetrie. Beim CSV-Import verlassen die Daten dein Gerät nicht. Wenn du Browserdaten löschst, können die Daten verloren gehen. Nutze deshalb regelmäßig den <b>JSON-Backup-Export</b>. Auf gemeinsam verwendeten Geräten sind die Daten nicht durch eine eigene Anmeldung geschützt.</p><div class="row-wrap section-gap"><button data-go="data" class="button primary">Daten verwalten</button><button data-action="clear" class="button danger">Lokale Projektdaten löschen</button></div></div></div>
 <div class="span-12"><div class="card"><h3 class="card-title">Berechnungsprinzipien</h3><div class="metric-list">${metric('EBITDA','Umsatz − Material − Personal − sonstige Aufwendungen')}${metric('EBIT','EBITDA − Abschreibungen')}${metric('EBT / Nettoergebnis','EBIT − Zinsaufwand / EBT − Ertragsteuern')}${metric('Working Capital (vereinfacht)','Vorräte + Forderungen − Lieferverbindlichkeiten')}${metric('EBITDA-Brücke','ΔUmsatz − ΔMaterial − ΔPersonal − ΔSonstige Kosten')}${metric('Detaillierter Stundensatz','(Kosten inkl. Reserve − Material-/Fremdleistungs-DB) / verrechenbare Stunden / (1 − Zielmarge)')}${metric('DCF-Unternehmenswert','Barwert der FCFF + Barwert des nachhaltigen Endwerts')}</div></div></div></div>`}
function menu(){return heading('Alle Bereiche','Wähle den gewünschten Arbeitsbereich.')+`<div class="grid">${nav.map(([id,icon,label])=>`<div class="span-6"><button class="action-tile" style="width:100%;min-height:85px" data-go="${id}"><span class="emoji">${icon}</span><strong>${html(label)} →</strong></button></div>`).join('')}</div>`}
function hydrate(input){
 const p=clone(defaults);
 if(!input||typeof input!=='object')throw new Error('Ungültige Projektdaten.');
 if(typeof input.company==='string'&&input.company.trim()&&input.company.length<=120)p.company=input.company;
 else throw new Error('Unternehmensname fehlt.');
 if(!Array.isArray(input.records)||!input.records.length||input.records.length>30)throw new Error('Ein bis 30 Geschäftsjahre sind erforderlich.');
 p.records=input.records.map(r=>{
  if(!r||E.validate(r).filter(e=>!e.includes('Umsatzerlöse sind 0')).length)throw new Error('Unplausible Jahresdaten im Projekt.');
  return {year:Number(r.year),...Object.fromEntries(E.KEYS.map(k=>[k,r[k]==null||r[k]===''?null:Number(r[k])]))};
 });
 if(new Set(p.records.map(r=>r.year)).size!==p.records.length)throw new Error('Doppelte Geschäftsjahre im Projekt.');
 p.year=p.records.some(r=>r.year===Number(input.year))?Number(input.year):Math.max(...p.records.map(r=>r.year));
 p.demo=input.demo===true;p.missingFields=Array.isArray(input.missingFields)?input.missingFields.filter(k=>E.KEYS.includes(k)):[];
 function merge(template,source,path){
  if(source===undefined)return clone(template);
  if(Array.isArray(template)){
   if(!Array.isArray(source)||source.length<1||source.length>(path==='hourlyPlan.teams'?20:5)||(path==='valuation.years'&&source.length!==5))throw new Error('Ungültige Liste: '+path);
   return source.map((s,i)=>merge(template[i]||template[0],s,path+'.'+i));
  }
  if(template&&typeof template==='object'){
   if(!source||typeof source!=='object'||Array.isArray(source))throw new Error('Ungültiges Modell: '+path);
   return Object.fromEntries(Object.entries(template).map(([k,v])=>[k,merge(v,source[k],path+'.'+k)]));
  }
  if(typeof template==='number'){
   if(source!==null&&(typeof source!=='number'||!Number.isFinite(source)))throw new Error('Ungültiger Zahlenwert: '+path);
  }else if(typeof source!=='string'||source.length>160)throw new Error('Ungültige Bezeichnung: '+path);
  return source;
 }
 for(const key of ['scenario','hourly','hourlyPlan','valuation','business','benchmark'])p[key]=merge(defaults[key],input[key],key);
 function checkScenario(s){
  for(const [key,d] of Object.entries(defaults.scenario)){
   const n=s[key];
   const limits={price:[-25,30],volume:[-40,40],material:[-25,35],personnel:[-20,35],overhead:[-25,35],productivity:[-25,25],serviceShare:[0,100],materialVariableShare:[0,100],overheadVariableShare:[0,100],employerFactor:[1,4],investmentYears:[1,50],taxPct:[0,100],collectionDays:[0,90],inventoryDays:[0,90],paymentDays:[0,90]};
   const [min,max]=limits[key]||[0,1e10];
   if(typeof n!=='number'||n<min||n>max||(key==='hires'&&!Number.isInteger(n)))throw new Error('Ungültige Szenario-Annahme: '+key);
  }
 }
 checkScenario(p.scenario);
 if(input.savedScenarios!==undefined){
  if(!Array.isArray(input.savedScenarios)||input.savedScenarios.length>100)throw new Error('Ungültige Szenarienliste.');
  p.savedScenarios=input.savedScenarios.map(s=>{
   if(!s||typeof s.name!=='string'||!s.name.trim()||s.name.length>100||typeof s.id!=='string'||s.id.length>100||typeof s.created!=='string'||!Number.isFinite(Date.parse(s.created))||!Number.isInteger(s.year))throw new Error('Ungültiges gespeichertes Szenario.');
   const parameters=merge(defaults.scenario,s.parameters,'scenario');checkScenario(parameters);
   return {name:s.name,id:s.id,created:s.created,year:s.year,parameters};
  });
 }
 p.scenarioName=typeof input.scenarioName==='string'&&input.scenarioName.length<=100?input.scenarioName:defaults.scenarioName;
 return p;
}
function applyPreset(id){
 const presets={price:{price:3},efficiency:{productivity:10,material:-2,collectionDays:5},downside:{volume:-15,material:5,personnel:3},growth:{volume:15,price:2,hires:1,investment:30000}};
 state.scenario={...clone(defaults.scenario),...presets[id]};
 state.scenarioName=({price:'Preise +3 %',efficiency:'Mehr Verrechenbarkeit',downside:'Auftragsrückgang',growth:'Wachstum & Team'})[id]||'Mein Szenario';
 state.view='scenario';persist();render(true);
}

  ...r.years.map((y,i)=>[y.year,...['growth','ebitMargin','daPct','capexPct','wcPct'].map(k=>p.years[i][k]),...['revenue','ebit','taxes','nopat','depreciation','capex','wc','deltaWC','fcff','discountFactor','pv'].map(k=>y[k])]),
  ['Nachhaltiger NOPAT',r.terminalNopat],['Nachhaltige Reinvestition = NOPAT*g/ROIC',r.terminalReinvestment],['Nachhaltiger FCFF',r.terminalFcff],['Endwert',r.terminalValue],['Endwert-Barwert',r.terminalPV],['Barwert explizite Planjahre',r.forecastPV],['Enterprise Value',r.enterpriseValue],['Überschüssige liquide Mittel',p.cash],['Finanzschulden',p.debt],['Sonstige Wertkorrekturen',p.adjustments],['Eigenkapitalwert',r.equityValue],['Grenzen','Endjahresdiskontierung; keine Verlustvorträge; indikativ, kein Bewertungsgutachten.'],...r.warnings.map(w=>['Hinweis',w])

  ...Object.entries(p.overheads).map(([k,v])=>['Gemeinkosten '+k,v]),

  ['Gesamtkosten',r.annualCosts],['Reserve',r.reserve],['Zu deckender Kostenbedarf',r.recovery],['Verrechenbare Stunden',r.hours],['Kostenuntergrenze inkl. Reserve',r.hourlyCost],['Netto-Zielstundensatz',r.price],['Aktueller Satz',p.currentRate],['Ergebnis bei aktuellem Satz nach Reserve',r.currentAfterReserve],
  ['Formel','max(0, Kosten inkl. Reserve minus Material-/Fremdleistungs-DB) / verrechenbare Stunden / (1-Zielmarge). Kalender: 52 Wochen, 5 Arbeitstage.'],...r.warnings.map(w=>['Hinweis',w])
 ],'Stundensatz');

function setpath(path,value){const parts=path.split('.');let obj=state;for(let i=0;i<parts.length-1;i++)obj=obj[parts[i]];obj[parts.at(-1)]=value;}
function saveInput(path,raw){
 const textual=path==='company'||path==='benchmark.label'||path==='scenarioName'||/^hourlyPlan\.teams\.\d+\.name$/.test(path);
 const value=textual?raw.trim():E.numbers(raw);
 const input=[...app.querySelectorAll('[data-model]')].find(el=>el.dataset.model===path);
 if(textual&&(!value||value.length>(path==='company'?120:100))){notify('Bitte eine Bezeichnung mit maximal '+(path==='company'?120:100)+' Zeichen eingeben.',true);return;}
 if(!textual && raw.trim()!=='' && value===null){notify('Bitte einen gültigen Zahlenwert eingeben.',true);return;}
 if(input&&!textual&&value!==null){
  const min=input.getAttribute('min'),max=input.getAttribute('max');
  if((min!==null&&value<Number(min))||(max!==null&&value>Number(max))||(path==='scenario.hires'&&!Number.isInteger(value))){notify('Eingabe außerhalb des zulässigen Bereichs.',true);input.setAttribute('aria-invalid','true');return;}
 }
 if(!path.startsWith('valuation.')&&!path.startsWith('hourlyPlan.')&&value===null){notify('Bitte die Szenario-Annahme vervollständigen.',true);return;}
 if(path.startsWith('business.')&&typeof value==='number'){
  const key=path.split('.')[1],bad=key.endsWith('Growth')?value<=-100:value<0;
  if(bad||(key==='loanYears'&&value<1)||(key==='taxPct'&&value>100)){notify('Eingabe außerhalb des zulässigen Bereichs.',true);return;}
 }
 setpath(path,value);
 if(path.startsWith('hourlyPlan.'))state.hourlyPlan.label='Eigene Modellannahmen';
 if(path.startsWith('valuation.'))state.valuation.label='Manuelle Planung';
 persist();render();
}
async function fileLoad(file){if(!file)return;try{if(file.size>2e6)throw new Error('CSV zu groß (maximal 2 MB).');const parsed=E.parseCsv(await file.text());const missingCore=['material','personnel','overhead'].filter(k=>parsed.missing.includes(k));if(missingCore.length)throw new Error('GuV-Pflichtspalten fehlen: '+missingCore.map(k=>E.LABELS[k]).join(', ')+'. Bitte CSV-Vorlage ausfüllen.');const problems=parsed.records.flatMap(r=>E.validate(r).filter(z=>!z.includes('Umsatzerlöse sind 0')));if(problems.length)throw new Error('Plausibilitätsfehler: '+problems.slice(0,3).join(' · '));if(!confirm('CSV-Daten übernehmen? Die bisherigen Jahresdaten werden ersetzt. Vorhandene Planungsannahmen und Szenarien bleiben erhalten.'))return;state.records=parsed.records;state.year=records().at(-1).year;state.demo=false;state.missingFields=parsed.missing;state.view='analysis';persist();render();notify('CSV importiert: '+parsed.records.length+' Geschäftsjahre. '+(parsed.missing.length?'Fehlende Spalten bitte prüfen.':''));}catch(err){notify('Import fehlgeschlagen: '+err.message,true)}}
async function restoreFile(file){try{if(!file||file.size>4e6)throw new Error('Datei fehlt oder ist zu groß');const p=JSON.parse(await file.text());if(!p||!Array.isArray(p.records)||!p.records.length||typeof p.company!=='string'||p.company.length>120)throw new Error('Ungültiges SoloCFO-Backup');if(p.records.length>30)throw new Error('Maximal 30 Geschäftsjahre möglich');if(p.records.some(r=>E.validate(r).length))throw new Error('Backup enthält unplausible Finanzdaten.');state=hydrate(p,true);state.view='dashboard';state.year=records().at(-1).year;persist();render();notify('Backup erfolgreich geladen');}catch(err){notify(err.message,true)}}
function bindDrop(){const zone=document.getElementById('uploadZone');if(!zone)return;zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover')});zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragover');fileLoad(e.dataTransfer.files[0])})}
app.addEventListener('click',e=>{
 const preset=e.target.closest('[data-preset]');if(preset){applyPreset(preset.dataset.preset);return;}
 const removeTeam=e.target.closest('[data-remove-team]');if(removeTeam){if(state.hourlyPlan.teams.length>1){state.hourlyPlan.teams.splice(Number(removeTeam.dataset.removeTeam),1);state.hourlyPlan.label='Eigene Modellannahmen';persist();render();}return;}
 const go=e.target.closest('[data-go]');if(go){e.preventDefault();state.view=go.dataset.go;render(true);return}const load=e.target.closest('[data-load-scenario]');if(load){const s=(state.savedScenarios||[]).find(x=>x.id===load.dataset.loadScenario);if(s){state.scenario=clone(s.parameters);state.year=s.year;state.view='scenario';persist();render();notify('Szenario geladen')}return}
 const deleteBtn=e.target.closest('[data-delete-scenario]');if(deleteBtn){if(!confirm('Gespeichertes Szenario löschen?'))return;state.savedScenarios=(state.savedScenarios||[]).filter(x=>x.id!==deleteBtn.dataset.deleteScenario);persist();render();notify('Szenario gelöscht');return}
 const remove=e.target.closest('[data-remove-year]');if(remove){const y=Number(remove.dataset.removeYear);if(state.records.length<=1){notify('Mindestens ein Jahr erforderlich.',true);return}if(!confirm('Geschäftsjahr '+y+' wirklich entfernen?'))return;state.records=state.records.filter(r=>r.year!==y);state.year=records().at(-1).year;state.demo=false;persist();render();notify('Jahr entfernt');return}const act=e.target.closest('[data-action]');if(!act)return;
 switch(act.dataset.action){
 case 'print': window.print();break;
 case 'save-scenario':{
 const title=state.scenarioName.trim();
 if(!title||title.length>100){notify('Bitte einen Namen mit maximal 100 Zeichen eingeben.',true);break;}
 if(state.savedScenarios.length>=100){notify('Maximal 100 Szenarien. Bitte zuerst bereinigen.',true);break;}
 state.savedScenarios.push({id:crypto.randomUUID?crypto.randomUUID():'s'+Date.now(),name:title,year:Number(state.year),created:new Date().toISOString(),parameters:clone(state.scenario)});
 state.view='decisions';persist();render(true);notify('Szenario gespeichert');break;}
 case 'export-scenarios':{
 const list=state.savedScenarios.filter(s=>s.year===Number(state.year));
 const heads=['Szenario','Basisjahr','Umsatz','EBITDA','EBITDA-Effekt','EBITDA-Marge (%)','Cashflow-Effekt Jahr 1',...Object.keys(defaults.scenario)];
 const rows=list.map(s=>{const r=E.simulate(current(),s.parameters);return [s.name,s.year,r.revenue,r.ebitda,r.deltaEbitda,r.ebitdaMargin,r.cashImpact,...Object.keys(defaults.scenario).map(k=>s.parameters[k])];});
 exportRows([['SoloCFO 3.0 · aktuelle Ist-Basis',state.company],heads,...rows],'Szenarien');break;}
 case 'export-dcf':exportDcf();break;
 case 'export-hourly':exportHourly();break;
 case 'dcf-from-actual':{
  const a=E.finance(current());
  if(a.depreciation===null||a.wc===null||a.cash===null||a.debt===null||a.revenue<=0){notify('Für die Übernahme fehlen Umsatz, Abschreibungen, NWC, Kasse oder Finanzschulden. Fehlende Werte bitte manuell planen.',true);break;}
  state.valuation={...state.valuation,baseYear:a.year,revenue:a.revenue,openingWC:a.wc,cash:a.cash,debt:a.debt,label:'Basiswerte aus Ist '+a.year+' · Planjahre separat'};
  persist();render();notify('Basisumsatz, NWC, Kasse und Schulden übernommen. Überschussliquidität und Planannahmen bitte prüfen.');break;}
 case 'add-team':if(state.hourlyPlan.teams.length>=20){notify('Maximal 20 Gruppen möglich.',true);break;}state.hourlyPlan.teams.push({...clone(defaults.hourlyPlan.teams[0]),name:'Neue Mitarbeitergruppe',fte:1});state.hourlyPlan.label='Eigene Modellannahmen';persist();render();break;
 case 'reset-hourly':if(confirm('Stundenplanung durch Beispielannahmen ersetzen?')){state.hourlyPlan=clone(defaults.hourlyPlan);persist();render();}break;
 case 'template':download(csvTemplate(),'SoloCFO-CSV-Vorlage.csv','text/csv;charset=utf-8');break;
 case 'backup':download(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'SoloCFO-Backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');break;
 case 'restore':document.getElementById('backupFile')?.click();break;
 case 'reset-scenario':state.scenario=clone(defaults.scenario);persist();render();notify('Szenario zurückgesetzt');break;
 case 'add-year':{let y=Number(prompt('Neues Geschäftsjahr (z. B. 2026):',String(records().at(-1).year+1)));if(!Number.isInteger(y)||y<2000||y>2100||state.records.some(x=>x.year===y)){notify('Bitte ein neues, gültiges Jahr eingeben.',true);return}const next={year:y};E.KEYS.forEach(k=>next[k]=['revenue','material','personnel','overhead'].includes(k)?0:null);state.records.push(next);state.year=y;state.demo=false;persist();render();notify('Neues Jahr angelegt – bitte Daten erfassen');break;}
 case 'reset-demo':if(confirm('Alle Projektdaten durch Demonstrationsdaten ersetzen? Vorher Backup exportieren!')){state=clone(defaults);persist();render();notify('Demodaten wiederhergestellt')}break;
 case 'clear':if(confirm('Alle gespeicherten SoloCFO-Projektdaten löschen? Dieser Schritt kann nicht rückgängig gemacht werden.')){try{localStorage.removeItem(STORAGE);localStorage.removeItem(OLD_STORAGE)}catch(_){}state=clone(defaults);state.company='Neues Unternehmen';state.demo=false;state.records=[{year:2026,...Object.fromEntries(E.KEYS.map(k=>[k,['revenue','material','personnel','overhead'].includes(k)?0:null]))}];render();notify('Lokale Daten gelöscht; leerer Datensatz geöffnet')}break;
 }
});
app.addEventListener('change',e=>{const t=e.target;if(t.id==='yearSelect'){state.year=Number(t.value);persist();render();return}if(t.id==='csvFile'){fileLoad(t.files[0]);return}if(t.id==='backupFile'){restoreFile(t.files[0]);return}if(t.dataset.model){saveInput(t.dataset.model,t.value);return}if(t.dataset.scenario){state.scenario[t.dataset.scenario]=Number(t.value);persist();render();return}if(t.dataset.editKey){const row=state.records.find(r=>r.year===Number(t.dataset.editYear));const n=E.numbers(t.value);if(!row||(n===null&& !['depreciation','interest','taxes','cash','receivables','inventory','payables','currentLiabilities','debt','equity','assets'].includes(t.dataset.editKey))||(n!==null&&n<0)){notify('Bitte einen nichtnegativen Betrag eingeben.',true);render();return}const prev=row[t.dataset.editKey];row[t.dataset.editKey]=n;const issues=E.validate(row).filter(x=>!x.includes('Umsatzerlöse sind 0'));if(issues.length){row[t.dataset.editKey]=prev;notify('Plausibilität: '+issues[0],true);render();return}state.demo=false;persist();render();notify('Geschäftsjahr '+row.year+' aktualisiert');return}}
);
